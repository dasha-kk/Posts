<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НаСвязи</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #09090b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .phone-frame { width: 100%; max-width: 390px; height: 812px; background: #000; border-radius: 40px; border: 10px solid #262626; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .app-header { position: absolute; top: 0; left: 0; right: 0; padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 15; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
    .app-title { font-size: 20px; font-weight: 800; color: #fff; }
    .add-btn { background: rgba(255,255,255,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .feed { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    .feed::-webkit-scrollbar { display: none; }
    .post { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #111827; overflow: hidden; }
    .carousel-track { display: flex; width: 100%; height: 100%; overflow-x: scroll; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; justify-content: center; align-items: center; background: #000; }
    .carousel-slide img, .carousel-slide video { width: 100%; height: 100%; object-fit: contain; }
    .audio-slide, .text-only-slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; text-align: center; color: #fff; background: linear-gradient(135deg, #312e81, #831843); }
    .audio-slide audio { width: 100%; max-width: 280px; margin-top: 16px; }
    .slide-dots { position: absolute; top: 62px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 12; pointer-events: none; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: 0.2s; }
    .dot.active { background: #fff; width: 16px; border-radius: 4px; }
    .nav-arrow { position: absolute; top: 45%; transform: translateY(-50%); background: rgba(0,0,0,0.45); color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 12; }
    .nav-arrow.left { left: 10px; }
    .nav-arrow.right { right: 10px; }
    .post-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 50px 16px 18px; background: linear-gradient(to top, rgba(0,0,0,0.95) 25%, rgba(0,0,0,0.6) 75%, transparent); color: #fff; z-index: 10; transition: 0.25s; max-height: 75%; display: flex; flex-direction: column; }
    .post-overlay.expanded { background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); border-radius: 20px 20px 0 0; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; }
    .user-info h4 { font-size: 14px; }
    .user-info span { font-size: 11px; color: #d1d5db; }
    .post-text-wrap { margin-bottom: 10px; overflow-y: auto; }
    .post-text { font-size: 14px; line-height: 1.4; color: #f3f4f6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
    .post-text.open { display: block; -webkit-line-clamp: unset; }
    .more-btn { background: none; border: none; color: #93c5fd; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 3px; }
    .notes-list { max-height: 90px; overflow-y: auto; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .note-item { font-size: 12px; background: rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 10px; color: #e5e7eb; }
    .post-actions { display: flex; gap: 8px; align-items: center; }
    .action-btn { background: rgba(255,255,255,0.18); border: none; border-radius: 20px; padding: 7px 12px; font-size: 13px; color: #fff; cursor: pointer; white-space: nowrap; }
    .action-btn.liked { background: #ef4444; font-weight: 600; }
    .note-form { display: flex; flex: 1; gap: 6px; }
    .note-input { flex: 1; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; padding: 7px 12px; color: #fff; font-size: 13px; outline: none; }
    .note-input::placeholder { color: #9ca3af; }
    .note-send { background: #6366f1; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-weight: bold; }
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: flex-end; z-index: 30; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; }
    .modal-actions { display: flex; gap: 8px; }
    .btn-submit { flex: 1; background: #6366f1; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #e5e7eb; color: #374151; border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <header class="app-header">
      <div class="app-title">НаСвязи</div>
      <button class="add-btn" onclick="openModal()">+ Пост</button>
    </header>
    <main class="feed" id="feed"></main>
    <div class="modal" id="postModal">
      <div class="modal-content">
        <h3>Новый пост</h3>
        <input type="text" id="authorInput" placeholder="Ваше имя" />
        <textarea id="textInput" rows="3" placeholder="Описание поста..."></textarea>
        <input type="file" id="fileInput" accept="image/*,video/*,audio/*" multiple />
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Отмена</button>
          <button class="btn-submit" onclick="addNewPost()">Опубликовать</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
